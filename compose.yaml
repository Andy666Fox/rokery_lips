services:
  app:
    build:
      context: .
      dockerfile: services/website/Dockerfile
    restart: unless-stopped
    mem_limit: 160m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
    expose:
      - "8000"
    environment:
      TG_CHANNEL: ${TG_CHANNEL:-Synchronisica}
      TG_CACHE_TTL: ${TG_CACHE_TTL:-60}
      TG_CACHE_STALE_TTL: ${TG_CACHE_STALE_TTL:-3600}
      TG_HTTP_TIMEOUT: ${TG_HTTP_TIMEOUT:-5}
      TG_PROXY: ${TG_PROXY:-}
    volumes:
      - ./services/website/data:/app/services/website/data:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 5s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: local
    volumes:
      - ./services/website/html:/srv:ro
      - ./deploy/caddy/common.caddy:/etc/caddy/common.caddy:ro
      - caddy_data:/data
      - caddy_config:/config

  mysql:
    image: mysql:8.4.8@sha256:2952e3be7807f06fc18de50b3ea1a632d5c70d63482ff7d7376fe3aa8999babf
    restart: unless-stopped
    mem_limit: 448m
    logging:
      driver: local
    environment:
      MYSQL_DATABASE: random_bot
      MYSQL_USER: random_bot
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql.cnf:/etc/mysql/conf.d/application.cnf:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -Nse "SELECT 1"']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
      start_interval: 5s

  bot:
    build:
      context: .
      dockerfile: services/random_telegram_bot/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
    environment:
      DATABASE_URL: mysql+aiomysql://random_bot:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@mysql:3306/random_bot
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET}
      BOT_TOKEN: ${BOT_TOKEN:-}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:-0}
      BOT_MESSAGES_FILE: /app/bot-messages/messages.toml
    volumes:
      - ./services/random_telegram_bot/src/random_telegram_bot/resources:/app/bot-messages:ro
    depends_on:
      mysql:
        condition: service_healthy
    expose: ["8001"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live',timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 5s

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
