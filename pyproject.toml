[project]
name = "synchronisica"
version = "0.4.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4==4.15.0",
    "fastapi==0.141.1",
    "httpx[socks]==0.28.1",
    "pydantic==2.13.5",
    "uvicorn[standard]==0.52.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
