[project]
name = "random-telegram-bot"
version = "0.5.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiogram==3.31.0",
    "sqlalchemy[asyncio]==2.1.4",
    "alembic==1.20.0",
    "aiomysql==0.3.2",
    "cryptography==50.0.2",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "uvicorn[standard]==0.52.4",
    "langdetect==1.0.9",
]

[build-system]
requires = ["uv_build==0.13.0"]
build-backend = "uv_build"
