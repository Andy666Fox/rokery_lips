[project]
name = "synchronisica-website"
version = "0.5.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4==4.15.0",
    "fastapi==0.141.1",
    "httpx[socks]==0.28.1",
    "pydantic==2.13.5",
    "uvicorn[standard]==0.52.4",
]

[build-system]
requires = ["uv_build==0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
