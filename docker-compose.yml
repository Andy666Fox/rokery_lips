services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - navidrome

  app:
    build: ./app
    container_name: app
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - TG_CHANNEL=${TG_CHANNEL:-Synchronisica}
      - TG_CACHE_TTL=${TG_CACHE_TTL:-60}
      - TG_HTTP_TIMEOUT=${TG_HTTP_TIMEOUT:-5}
      - TG_PROXY=${TG_PROXY:-}
    volumes:
      - ./html:/app/static:ro
      - ./data:/app/data

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    expose:
      - "4533"
    environment:
      - ND_LOGLEVEL=${ND_LOGLEVEL:-info}
      - ND_SCANSCHEDULE=${ND_SCANSCHEDULE:-1h}
      - ND_SESSIONTIMEOUT=${ND_SESSIONTIMEOUT:-24h}
      - ND_BASEURL=
      - ND_ENABLEINSIGHTSCOLLECTOR=false
    volumes:
      - navidrome_data:/data
      - ./music:/music:ro

volumes:
  caddy_data:
  caddy_config:
  navidrome_data:
