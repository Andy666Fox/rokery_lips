<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1592" viewBox="0 0 1320 1592">
<rect width="100%" height="100%" fill="#101820"/>
<style>text{font:14px monospace;fill:#edf4fa}.title{font-weight:bold;font-size:17px}</style>
<text x="30" y="30">Database ER — solid: enforced FK; dashed: logical legacy relation</text>
<path d="M1090.0,85 L650.0,85" stroke="#56b5cb" stroke-width="2"/>
<path d="M1090.0,85 L210.0,458" stroke="#56b5cb" stroke-width="2"/>
<path d="M650.0,831 L1090.0,458" stroke="#56b5cb" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M1090.0,85 L1090.0,458" stroke="#56b5cb" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M650.0,831 L210.0,831" stroke="#56b5cb" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M1090.0,85 L650.0,831" stroke="#56b5cb" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="30" y="70" width="360" height="71" rx="8" fill="#1e2b38" stroke="#56b5cb"/>
<text x="42" y="95" class="title">alembic_version</text>
<text x="42" y="122">PK version_num: VARCHAR(32)</text>
<rect x="470" y="70" width="360" height="218" rx="8" fill="#1e2b38" stroke="#56b5cb"/>
<text x="482" y="95" class="title">channel_checks</text>
<text x="482" y="122">PK channel_id: BIGINT</text>
<text x="482" y="143">   state: VARCHAR(16)</text>
<text x="482" y="164">   next_check_at: FLOAT</text>
<text x="482" y="185">   attempts: INTEGER</text>
<text x="482" y="206">   last_error: VARCHAR(64)?</text>
<text x="482" y="227">   import_sha256: VARCHAR(64)</text>
<text x="482" y="248">   source_urls: TEXT</text>
<text x="482" y="269">   attribution: TEXT</text>
<rect x="910" y="70" width="360" height="281" rx="8" fill="#1e2b38" stroke="#56b5cb"/>
<text x="922" y="95" class="title">channels</text>
<text x="922" y="122">PK channel_id: BIGINT</text>
<text x="922" y="143">   channelnick: VARCHAR(255)</text>
<text x="922" y="164">   added_at: DATETIME?</text>
<text x="922" y="185">   status: TINYINT</text>
<text x="922" y="206">   likes: INTEGER</text>
<text x="922" y="227">   dislikes: INTEGER</text>
<text x="922" y="248">   avg_score: FLOAT</text>
<text x="922" y="269">   subscriber_count: BIGINT?</text>
<text x="922" y="290">   subscriber_display: VARCHAR(32)?</text>
<text x="922" y="311">   last_post_at: DATETIME?</text>
<text x="922" y="332">   last_checked_at: DATETIME?</text>
<rect x="30" y="443" width="360" height="176" rx="8" fill="#1e2b38" stroke="#56b5cb"/>
<text x="42" y="468" class="title">discovered_channels</text>
<text x="42" y="495">PK telegram_id: BIGINT</text>
<text x="42" y="516">FK channel_id: BIGINT</text>
<text x="42" y="537">   username: VARCHAR(32)</text>
<text x="42" y="558">   sources: JSON</text>
<text x="42" y="579">   verified_at: FLOAT</text>
<text x="42" y="600">   identity_source: VARCHAR(32)</text>
<rect x="470" y="443" width="360" height="92" rx="8" fill="#1e2b38" stroke="#56b5cb"/>
<text x="482" y="468" class="title">legacy_imports</text>
<text x="482" y="495">PK sha256: VARCHAR(64)</text>
<text x="482" y="516">   completed_at: DATETIME</text>
<rect x="910" y="443" width="360" height="113" rx="8" fill="#1e2b38" stroke="#56b5cb"/>
<text x="922" y="468" class="title">ratings</text>
<text x="922" y="495">PK telegram_id: BIGINT</text>
<text x="922" y="516">PK channel_id: BIGINT</text>
<text x="922" y="537">   score: INTEGER</text>
<rect x="30" y="816" width="360" height="113" rx="8" fill="#1e2b38" stroke="#56b5cb"/>
<text x="42" y="841" class="title">subscribtions</text>
<text x="42" y="868">PK user_id: BIGINT</text>
<text x="42" y="889">   sub_level: INTEGER</text>
<text x="42" y="910">   expires_at: DATETIME?</text>
<rect x="470" y="816" width="360" height="323" rx="8" fill="#1e2b38" stroke="#56b5cb"/>
<text x="482" y="841" class="title">users</text>
<text x="482" y="868">PK telegram_id: BIGINT</text>
<text x="482" y="889">   username: VARCHAR(255)</text>
<text x="482" y="910">   registred_at: DATETIME?</text>
<text x="482" y="931">   level: INTEGER</text>
<text x="482" y="952">   level_points: INTEGER</text>
<text x="482" y="973">   viewed_channels: INTEGER</text>
<text x="482" y="994">   suggested_channels: INTEGER</text>
<text x="482" y="1015">   likes: INTEGER</text>
<text x="482" y="1036">   dislikes: INTEGER</text>
<text x="482" y="1057">   ld_ratio: FLOAT</text>
<text x="482" y="1078">   last_channel_id: INTEGER</text>
<text x="482" y="1099">   last_online: DATETIME?</text>
<text x="482" y="1120">   awaiting_suggestion: TINYINT</text>
<rect x="910" y="816" width="360" height="92" rx="8" fill="#1e2b38" stroke="#56b5cb"/>
<text x="922" y="841" class="title">verification_control</text>
<text x="922" y="868">PK name: VARCHAR(32)</text>
<text x="922" y="889">   not_before: FLOAT</text>
<rect x="30" y="1189" width="360" height="302" rx="8" fill="#1e2b38" stroke="#56b5cb"/>
<text x="42" y="1214" class="title">webhook_inbox</text>
<text x="42" y="1241">PK sequence: BIGINT</text>
<text x="42" y="1262">   update_id: BIGINT</text>
<text x="42" y="1283">   chat_id: BIGINT</text>
<text x="42" y="1304">   payload: JSON</text>
<text x="42" y="1325">   state: VARCHAR(16)</text>
<text x="42" y="1346">   attempts: INTEGER</text>
<text x="42" y="1367">   next_attempt_at: FLOAT</text>
<text x="42" y="1388">   lease_until: FLOAT</text>
<text x="42" y="1409">   actions: JSON?</text>
<text x="42" y="1430">   completed_at: FLOAT?</text>
<text x="42" y="1451">   last_error: TEXT?</text>
<text x="42" y="1472">   received_at: FLOAT</text>
</svg>